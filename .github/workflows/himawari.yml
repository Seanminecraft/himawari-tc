# 向日葵 9 號原始檔 → 颱風衛星圖 → GitHub Pages
# 每 10 分鐘自動執行（分鐘 3、13、23…，避開整點排隊尖峰），也可以在 Actions 頁面手動按 Run workflow。
# 圖片不會存進 git：每次都打包成 Pages artifact 直接部署；動畫影格從目前線上網站抓回來接續。
# v17：同一個工作流程也畫「氣象署雷達回波＋1 小時雨量預報」透明圖層（radar/）與「台灣 衛星＋雷達疊圖」。
#      雷達資料用氣象署 S3 公開鏡像（不用金鑰）；secrets.CWA_API_KEY 只是備援（沒設也能跑，絕不會印出）。
#      向日葵沒新掃描但雷達有新資料 → 只抓回線上衛星圖＋更新雷達（輕量安裝 numpy／pillow）。
# v18：48 小時回放（history/）：雷達每 10 分鐘、衛星／疊圖每 20 分鐘、颱風／區域圖每 30 分鐘，縮小後存放。
#      上一版回放圖放在 Actions 快取（hist_cache），不必每次從網站重抓；history/ 預算 250 MB（整站 < 300 MB）。
# v19：ATMS 衛星微波暖心分析（atms/）：NOAA-20／21／SNPP 經過颱風時，從 NOAA AWS 公開桶（免帳號）只抓需要的幾 MB 來算。
#      快速檢查會看「有沒有新過境資料」（atms_skip）；沒有的話只把上一版原樣放回網站，不安裝套件。
# v20：部署用唯一版本（自寫 API 呼叫）＋部署後向原站核對，沒生效自動重部署一次，仍失敗就標紅（見 deploy 工作）。
name: himawari

on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '就算線上已是最新掃描也重新繪圖（測試用）'
        type: boolean
        default: false
      scan:
        description: '指定掃描時間 YYYYMMDDHHMM（UTC，留空＝最新）'
        type: string
        default: ''

# 同一時間只跑一個；上一個還沒跑完，新的排隊等，不會中途取消。
# GitHub 規則：同一群組最多「1 個執行中＋1 個等待中」，再來新的會把舊的「等待中」取消（顯示灰色 cancelled，屬正常）。
# 觸發來源：① Apps Script addonTick 每 10 分鐘 workflow_dispatch（主要）② 下面的 cron（備援，GitHub 排程常延遲或漏跑）
concurrency:
  group: himawari
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      skip: ${{ steps.final.outputs.skip }}
      probe: ${{ steps.mark.outputs.probe }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
      base_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v7

      - name: 讀取 GitHub Pages 網址
        id: pages
        uses: actions/configure-pages@v6

      # 只用內建 python3＋標準函式庫：線上已是最新掃描就直接結束（不安裝套件、不繪圖、不部署）
      - name: 快速檢查（線上已是最新就略過）
        id: quick
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_url }}/
          EVENT: ${{ github.event_name }}
          IN_FORCE: ${{ inputs.force }}
          IN_SCAN: ${{ inputs.scan }}
        run: python3 scripts/quick_check.py

      - name: 安裝 Python 3.12（含 pip 快取）
        if: steps.quick.outputs.skip != 'true' || steps.quick.outputs.radar_skip != 'true' || steps.quick.outputs.atms_skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-radar.txt
            requirements-atms.txt

      - name: 海岸線資料快取（cartopy / Natural Earth）
        if: steps.quick.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/cartopy
          key: cartopy-naturalearth-50m-v1

      - name: 安裝套件
        if: steps.quick.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 安裝雷達用輕量套件（只更新雷達／ATMS 時）
        if: steps.quick.outputs.skip == 'true' && (steps.quick.outputs.radar_skip != 'true' || steps.quick.outputs.atms_skip != 'true')
        run: pip install -r requirements-radar.txt

      - name: 下載衛星原始檔並繪圖
        id: render
        if: steps.quick.outputs.skip != 'true'
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_url }}/
          MPLBACKEND: Agg
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          EVENT: ${{ github.event_name }}
          IN_FORCE: ${{ inputs.force }}
          IN_SCAN: ${{ inputs.scan }}
        run: |
          ARGS="--out site"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$IN_FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
            if [[ "$IN_SCAN" =~ ^[0-9]{12}$ ]]; then ARGS="$ARGS --scan $IN_SCAN --force"; fi
          fi
          python scripts/himawari_pipeline.py $ARGS

      # v17：向日葵沒新圖、但雷達有新資料 → 先把線上衛星圖原樣抓回來（抓不到就不部署，避免弄壞網站）
      # v19：有新的 ATMS 過境也一樣（這樣 10–20 分鐘內就會更新，不必等下一張向日葵）
      - name: 抓回線上衛星圖（只更新雷達／ATMS 時）
        id: mirror
        if: (steps.quick.outputs.radar_skip != 'true' || steps.quick.outputs.atms_skip != 'true') && (steps.quick.outputs.skip == 'true' || steps.render.outputs.skip == 'true')
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_url }}/
        run: python3 scripts/mirror_live.py --out site

      - name: 雷達回波＋1 小時雨量預報圖層
        id: radar
        if: steps.render.outputs.skip == 'false' || steps.mirror.outcome == 'success'
        continue-on-error: true
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_url }}/
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python scripts/cwa_radar.py --out site

      - name: 決定是否部署
        id: final
        if: always()
        env:
          RENDER: ${{ steps.render.outputs.skip }}
          MIRROR: ${{ steps.mirror.outcome }}
          RADAR_OK: ${{ steps.radar.outputs.radar_ok }}
          ATMS_SKIP: ${{ steps.quick.outputs.atms_skip }}
        run: |
          # v19：只有 ATMS 有新過境（雷達剛好抓不到）也要部署
          if [ "$RENDER" = "false" ] || { [ "$MIRROR" = "success" ] && { [ "$RADAR_OK" = "true" ] || [ "$ATMS_SKIP" = "false" ]; }; }; then
            echo "✅ 部署（衛星：${RENDER:-略過}；雷達：${RADAR_OK:-未跑}；ATMS 略過：${ATMS_SKIP:-?}）"; echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "⏭️ 不部署（線上已是最新）"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # v18：48 小時回放。上一版的回放圖從 Actions 快取還原（不吃 GitHub Pages 流量）；快取沒有的才從線上網站補抓
      - name: 還原 48 小時回放（快取）
        if: steps.final.outputs.skip == 'false'
        uses: actions/cache/restore@v6
        with:
          path: hist_cache
          key: hist48-v1-${{ github.run_id }}
          restore-keys: |
            hist48-v1-

      # v19：ATMS 微波暖心。有新過境才安裝套件＋分析；否則只把上一版（快取→線上網站）放回 site/atms/（只用標準函式庫）
      - name: 安裝 ATMS 分析套件（有新過境時）
        if: steps.final.outputs.skip == 'false' && steps.quick.outputs.atms_skip != 'true'
        continue-on-error: true
        run: pip install -r requirements-atms.txt

      - name: ATMS 微波暖心分析
        id: atms
        if: steps.final.outputs.skip == 'false'
        continue-on-error: true
        timeout-minutes: 5
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_url }}/
          MPLBACKEND: Agg
          ATMS_SKIP: ${{ steps.quick.outputs.atms_skip }}
        run: |
          if [ "$ATMS_SKIP" = "true" ]; then
            python3 scripts/atms_warmcore.py --out site --cache hist_cache --carry
          else
            python3 scripts/atms_warmcore.py --out site --cache hist_cache
          fi

      - name: ATMS 失敗時沿用上一版
        if: steps.final.outputs.skip == 'false' && steps.atms.outcome == 'failure'
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_url }}/
        run: python3 scripts/atms_warmcore.py --out site --cache hist_cache --carry

      - name: 48 小時回放（雷達／衛星／颱風圖）
        id: hist
        if: steps.final.outputs.skip == 'false'
        continue-on-error: true
        timeout-minutes: 6
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_url }}/
        run: python scripts/history.py --out site --cache hist_cache

      # 回放失敗也照樣部署：沿用快取裡上一版的回放圖（網頁最多退回「最近 2 小時」動畫）
      - name: 回放失敗時沿用上一版
        if: steps.final.outputs.skip == 'false' && steps.hist.outcome == 'failure'
        run: |
          if [ -d hist_cache/atms ] && [ ! -f site/atms/latest.json ]; then mkdir -p site/atms && cp -r hist_cache/atms/. site/atms/; fi
          if [ -d hist_cache/history ]; then
            mkdir -p site/history && cp -r hist_cache/history/. site/history/
            cp -f hist_cache/history.json site/history/history.json 2>/dev/null || true
          fi

      - name: 儲存 48 小時回放（快取）
        if: steps.final.outputs.skip == 'false' && steps.hist.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: hist_cache
          key: hist48-v1-${{ github.run_id }}

      # 診斷用：核對這次要發布的 latest.json，並寫一個 deploy-check.json 標記（不影響其他功能）
      - name: 核對發布內容
        id: mark
        if: steps.final.outputs.skip == 'false'
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, hashlib, datetime
          p = os.path.realpath('site/latest.json')
          d = json.load(open(p, encoding='utf-8'))
          st = os.stat(p)
          h = hashlib.sha256(open(p, 'rb').read()).hexdigest()
          print('路徑', p)
          print('大小', st.st_size, 'bytes；修改時間(UTC)', datetime.datetime.utcfromtimestamp(st.st_mtime).isoformat() + 'Z')
          print('sha256', h)
          print('scanId', d.get('scanId'), 'scanTime', d.get('scanTime'), 'generated', d.get('generated'))
          mark = {'runId': os.environ['RUN_ID'], 'runAttempt': os.environ['RUN_ATTEMPT'], 'headSha': os.environ['HEAD_SHA'],
                  'scanId': d.get('scanId'), 'scanTime': d.get('scanTime'), 'generated': d.get('generated'),
                  'latestSha256': h, 'packedAt': datetime.datetime.utcnow().isoformat(timespec='seconds') + 'Z'}
          with open('site/deploy-check.json', 'w', encoding='utf-8') as f:
              json.dump(mark, f, ensure_ascii=False, indent=1)
          print('deploy-check.json', json.dumps(mark, ensure_ascii=False))
          # v20：部署後核對用的探針（這次專用的新網址，CDN 沒快取過，保證問到原站）；舊探針不會留在網站上
          os.makedirs('site/deploy-probe', exist_ok=True)
          for k in range(48):
              with open(f"site/deploy-probe/{mark['runId']}-{mark['runAttempt']}-{k}.json", 'w', encoding='utf-8') as f:
                  json.dump(mark, f, ensure_ascii=False)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('probe=true\n')
          PY

      - name: 打包網站
        id: upload
        if: steps.final.outputs.skip == 'false'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # v20：一勞永逸修正「部署回報成功、網站卻停在舊圖」
  # 根因：actions/deploy-pages 一律用 commit SHA 當 Pages 部署版本（pages_build_version＝部署 ID），
  #      runner 也不讓工作流程覆寫 GITHUB_SHA。這個 repo 很少 commit，幾百次部署共用同一個 ID，
  #      Pages 會不定期把新部署當重複、繼續提供舊內容（actions/deploy-pages#383；空 commit 換 SHA 就恢復即為此故）。
  # 修正：① scripts/pages_deploy.py 直接呼叫同一支官方 API，每次用唯一版本（SHA＋run id＋attempt）
  #      ② 部署後用這次專用的探針檔直接向原站核對（CDN 會忽略 ?參數並快取 10 分鐘，所以不能只讀 deploy-check.json）
  #      ③ 沒生效就換一個版本再部署一次 ④ 還是不行就讓這次 run 失敗（紅色），不再假裝成功。
  #      自寫部署萬一 API 出錯，會退回官方 actions/deploy-pages，網站不會因此停更。
  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ needs.build.outputs.base_url }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PAGE_URL: ${{ needs.build.outputs.base_url }}
      ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
      VERSION: ${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: 取得部署／核對程式
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/pages_deploy.py
            scripts/verify_pages.py
          sparse-checkout-cone-mode: false

      - name: 部署到 GitHub Pages（唯一版本）
        id: deploy1
        continue-on-error: true
        timeout-minutes: 9
        run: python3 scripts/pages_deploy.py --artifact-id "$ARTIFACT_ID" --version "$VERSION"

      - name: 備援：官方 deploy-pages（只在上一步 API 出錯時）
        id: deployment
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: 核對線上網站（原站是否已換成這次）
        id: verify1
        if: needs.build.outputs.probe == 'true'
        continue-on-error: true
        timeout-minutes: 6
        run: python3 scripts/verify_pages.py --base "$PAGE_URL" --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT" --start 0 --count 24

      - name: 沒生效 → 換新版本再部署一次
        if: steps.verify1.outcome == 'failure'
        timeout-minutes: 9
        run: python3 scripts/pages_deploy.py --artifact-id "$ARTIFACT_ID" --version "$VERSION-retry"

      - name: 再次核對（還是舊的就讓這次失敗）
        if: steps.verify1.outcome == 'failure'
        timeout-minutes: 6
        run: |
          if python3 scripts/verify_pages.py --base "$PAGE_URL" --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT" --start 24 --count 24; then
            echo "✅ 重新部署後已生效"
          else
            echo "::error::重新部署後 GitHub Pages 仍提供舊內容；請看 githubstatus.com，或手動再跑一次 himawari"
            exit 1
          fi
