# 向日葵 9 號原始檔 → 颱風衛星圖 → GitHub Pages
# 每 10 分鐘自動執行（分鐘 3、13、23…，避開整點排隊尖峰），也可以在 Actions 頁面手動按 Run workflow。
# 圖片不會存進 git：每次都打包成 Pages artifact 直接部署；動畫影格從目前線上網站抓回來接續。
# v17：同一個工作流程也畫「氣象署雷達回波＋1 小時雨量預報」透明圖層（radar/）與「台灣 衛星＋雷達疊圖」。
#      雷達資料用氣象署 S3 公開鏡像（不用金鑰）；secrets.CWA_API_KEY 只是備援（沒設也能跑，絕不會印出）。
#      向日葵沒新掃描但雷達有新資料 → 只抓回線上衛星圖＋更新雷達（輕量安裝 numpy／pillow）。
name: himawari

on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '就算線上已是最新掃描也重新繪圖（測試用）'
        type: boolean
        default: false
      scan:
        description: '指定掃描時間 YYYYMMDDHHMM（UTC，留空＝最新）'
        type: string
        default: ''

# 同一時間只跑一個；上一個還沒跑完，新的排隊等，不會中途取消。
# GitHub 規則：同一群組最多「1 個執行中＋1 個等待中」，再來新的會把舊的「等待中」取消（顯示灰色 cancelled，屬正常）。
# 觸發來源：① Apps Script addonTick 每 10 分鐘 workflow_dispatch（主要）② 下面的 cron（備援，GitHub 排程常延遲或漏跑）
concurrency:
  group: himawari
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      skip: ${{ steps.final.outputs.skip }}
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v7

      - name: 讀取 GitHub Pages 網址
        id: pages
        uses: actions/configure-pages@v6

      # 只用內建 python3＋標準函式庫：線上已是最新掃描就直接結束（不安裝套件、不繪圖、不部署）
      - name: 快速檢查（線上已是最新就略過）
        id: quick
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_url }}/
          EVENT: ${{ github.event_name }}
          IN_FORCE: ${{ inputs.force }}
          IN_SCAN: ${{ inputs.scan }}
        run: python3 scripts/quick_check.py

      - name: 安裝 Python 3.12（含 pip 快取）
        if: steps.quick.outputs.skip != 'true' || steps.quick.outputs.radar_skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-radar.txt

      - name: 海岸線資料快取（cartopy / Natural Earth）
        if: steps.quick.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/cartopy
          key: cartopy-naturalearth-50m-v1

      - name: 安裝套件
        if: steps.quick.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 安裝雷達用輕量套件（只更新雷達時）
        if: steps.quick.outputs.skip == 'true' && steps.quick.outputs.radar_skip != 'true'
        run: pip install -r requirements-radar.txt

      - name: 下載衛星原始檔並繪圖
        id: render
        if: steps.quick.outputs.skip != 'true'
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_url }}/
          MPLBACKEND: Agg
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          EVENT: ${{ github.event_name }}
          IN_FORCE: ${{ inputs.force }}
          IN_SCAN: ${{ inputs.scan }}
        run: |
          ARGS="--out site"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$IN_FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
            if [[ "$IN_SCAN" =~ ^[0-9]{12}$ ]]; then ARGS="$ARGS --scan $IN_SCAN --force"; fi
          fi
          python scripts/himawari_pipeline.py $ARGS

      # v17：向日葵沒新圖、但雷達有新資料 → 先把線上衛星圖原樣抓回來（抓不到就不部署，避免弄壞網站）
      - name: 抓回線上衛星圖（只更新雷達時）
        id: mirror
        if: steps.quick.outputs.radar_skip != 'true' && (steps.quick.outputs.skip == 'true' || steps.render.outputs.skip == 'true')
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_url }}/
        run: python3 scripts/mirror_live.py --out site

      - name: 雷達回波＋1 小時雨量預報圖層
        id: radar
        if: steps.render.outputs.skip == 'false' || steps.mirror.outcome == 'success'
        continue-on-error: true
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_url }}/
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python scripts/cwa_radar.py --out site

      - name: 決定是否部署
        id: final
        if: always()
        env:
          RENDER: ${{ steps.render.outputs.skip }}
          MIRROR: ${{ steps.mirror.outcome }}
          RADAR_OK: ${{ steps.radar.outputs.radar_ok }}
        run: |
          if [ "$RENDER" = "false" ] || { [ "$MIRROR" = "success" ] && [ "$RADAR_OK" = "true" ]; }; then
            echo "✅ 部署（衛星：${RENDER:-略過}；雷達：${RADAR_OK:-未跑}）"; echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "⏭️ 不部署（線上已是最新）"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 打包網站
        if: steps.final.outputs.skip == 'false'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
